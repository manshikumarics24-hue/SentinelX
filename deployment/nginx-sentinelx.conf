# ==============================================================================
# SENTINELX PRODUCTION REVERSE PROXY CONFIGURATION (NGINX)
# 100% Free - Layer 7 Protection, Rate Limiting & Traffic Mirroring to SOC
# ==============================================================================

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # 1. Edge In-Memory Rate Limiting Zones (Free Nginx Leaky Bucket)
    # Allows 30 requests per second per IP with burst buffer of 20
    limit_req_zone $binary_remote_addr zone=global_rate_limit:10m rate=30r/s;
    limit_req_status 429;

    # 2. Main E-Commerce Web Server
    server {
        listen 80;
        server_name your-ecommerce-domain.com localhost;

        # Static assets (images, css, js) served directly from cache without hitting backend
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
            root /var/www/ecommerce/dist;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Dynamic Application Requests (Product pages, Cart, APIs)
        location / {
            # Pass original client IP to backend (crucial for SentinelX geo-location)
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            # Enforce edge rate limiting
            limit_req zone=global_rate_limit burst=20 nodelay;

            # Forward traffic to your actual E-Commerce Backend (Node.js, Django, FastAPI, PHP)
            proxy_pass http://127.0.0.1:3000;

            # Asynchronously mirror traffic to SentinelX SOC engine without adding latency
            mirror /mirror_to_sentinelx;
        }

        # Internal mirror route that reports traffic telemetry to SentinelX
        location = /mirror_to_sentinelx {
            internal;
            proxy_pass http://127.0.0.1:8001/api/traffic;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}
